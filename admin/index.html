<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sips — Site Admin</title>
  <script>
    /* Silent sign-in on the live site. The Worker proxy (worker.js)
       injects the real GitHub credentials server-side — gated by the
       Cloudflare Access email login — so the CMS just needs any token
       value. Pre-seeding its stored session before it boots means owners
       never see a sign-in dialog at all: email code → editor.
       (Skipped off-domain so local development still shows sign-in.) */
    (function () {
      if (!/(^|\.)sutherlinsips\.com$/.test(location.hostname)) {
        return;
      }
      try {
        var existing = localStorage.getItem("sveltia-cms.user");
        if (!existing || !JSON.parse(existing).token) {
          localStorage.setItem(
            "sveltia-cms.user",
            JSON.stringify({ backendName: "github", token: "access-gated-proxy" })
          );
        }
      } catch (e) {
        /* storage unavailable — the manual sign-in below still works */
      }
    })();
  </script>
</head>
<body>
  <!-- Sveltia CMS (self-hosted, version-pinned bundle): a static admin
       panel that reads/writes this GitHub repo through the Worker proxy. -->
  <script src="sveltia-cms.js"></script>
  <script>
    /* Fallback UI cleanup, only relevant if the silent sign-in above
       couldn't run: hide the OAuth button (no relay deployed — it
       dead-ends at a Netlify 404), leaving the token option. Any typed
       value works on the live site; the proxy supplies real credentials. */
    (function () {
      function hideOAuthButton(root) {
        root.querySelectorAll("button").forEach(function (btn) {
          var label = (btn.textContent || "").trim();
          if (/^Sign In with /i.test(label)) {
            btn.style.display = "none";
          }
        });
      }
      var observer = new MutationObserver(function () {
        hideOAuthButton(document);
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      hideOAuthButton(document);
    })();
  </script>
</body>
</html>
