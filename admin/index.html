<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sips — Site Admin</title>
</head>
<body>
  <!-- Sveltia CMS (self-hosted bundle): a static admin panel that
       reads/writes this GitHub repo. Sign in with a GitHub account that
       has write access, using "Sign In Using Access Token" with a
       fine-grained personal access token (see repo README). -->
  <script src="sveltia-cms.js"></script>
  <script>
    /* Our setup has no OAuth relay, so the "Sign In with GitHub" button
       always dead-ends at a Netlify 404. Hide it, leaving only the
       working "Sign In Using Access Token" option. */
    (function () {
      function hideOAuthButton(root) {
        root.querySelectorAll("button").forEach(function (btn) {
          var label = (btn.textContent || "").trim();
          if (/^Sign In with /i.test(label)) {
            btn.style.display = "none";
          }
        });
      }
      var observer = new MutationObserver(function () {
        hideOAuthButton(document);
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      hideOAuthButton(document);
    })();

    /* Auto sign-in on the live site: the Worker proxy supplies the real
       GitHub credentials server-side (gated by Cloudflare Access), so the
       CMS just needs any token value. Click through the dialog so owners
       never see it. Runs once per page load; the manual buttons remain
       as a fallback if anything changes. */
    (function () {
      if (!/(^|\.)sutherlinsips\.com$/.test(location.hostname)) {
        return;
      }
      var attempts = 0;
      var timer = setInterval(function () {
        attempts++;
        if (attempts > 40) {
          clearInterval(timer);
          return;
        }
        var buttons = Array.prototype.slice.call(document.querySelectorAll("button"));
        var input = document.querySelector("input[type=text], input[type=password]");
        var signIn = buttons.find(function (b) {
          return b.textContent.trim() === "Sign In";
        });
        if (input && signIn) {
          input.value = "access-gated-proxy";
          input.dispatchEvent(new Event("input", { bubbles: true }));
          signIn.click();
          clearInterval(timer);
          return;
        }
        var tokenBtn = buttons.find(function (b) {
          return /Access Token/i.test(b.textContent);
        });
        if (tokenBtn) {
          tokenBtn.click();
        }
      }, 250);
    })();
  </script>
</body>
</html>
