<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sips Admin — Diagnostics</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; background: #111; color: #9f9;
           padding: 1.2rem; font-size: 13px; line-height: 1.5; }
    h1 { color: #fff; font-size: 16px; }
    pre { white-space: pre-wrap; word-break: break-all; background: #1c1c1c;
          padding: 1rem; border-radius: 8px; }
    .ok { color: #7ac943; } .bad { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>Sips Admin Diagnostics</h1>
  <p>Screenshot or copy everything below and send it to Claude.</p>
  <pre id="out">running…</pre>
  <script>
    (async function () {
      var lines = [];
      function log(s) {
        lines.push(s);
        document.getElementById("out").textContent = lines.join("\n");
      }
      log("host: " + location.hostname + "   time: " + new Date().toISOString());
      try {
        var rec = localStorage.getItem("sveltia-cms.user");
        log("stored session (raw): " + (rec === null ? "(none)" : JSON.stringify(rec.slice(0, 120))));
        try {
          var parsed = JSON.parse(rec || "null");
          log("stored session parses: yes; has token: " + !!(parsed && parsed.token));
        } catch (e2) {
          log("stored session parses: NO (corrupt) — " + e2.message);
        }
        localStorage.setItem("sips-debug-write-test", "ok");
        localStorage.removeItem("sips-debug-write-test");
        log("storage writable: yes");
      } catch (e) {
        log("storage: BLOCKED (" + e.message + ")");
      }
      async function probe(label, url, opts) {
        try {
          var res = await fetch(url, opts);
          var text = await res.text();
          var ct = res.headers.get("content-type") || "?";
          log("");
          log(label + " -> HTTP " + res.status + "  [" + ct.split(";")[0] + "]" +
              (res.redirected ? "  (redirected to " + res.url.slice(0, 70) + ")" : ""));
          log("   body: " + (text ? text.slice(0, 160).replace(/\s+/g, " ") : "(empty)"));
        } catch (e) {
          log("");
          log(label + " -> FETCH ERROR: " + e.message);
        }
      }
      await probe("A. GET /api/v3/user (default creds)", "/api/v3/user");
      await probe("B. GET /api/v3/user (creds omitted)", "/api/v3/user", { credentials: "omit" });
      await probe("C. GET /api/v3/user (creds included)", "/api/v3/user", { credentials: "include" });
      await probe("D. POST /api/graphql (creds included)", "/api/graphql", {
        method: "POST",
        credentials: "include",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ query: "{viewer{login}}" }),
      });
      await probe("E. GET /api/v3/repos/Autoris-hq/SipsSutherlin/collaborators/kjgpete (incl)",
        "/api/v3/repos/Autoris-hq/SipsSutherlin/collaborators/kjgpete", { credentials: "include" });
      log("");
      log("done.");
    })();
  </script>
</body>
</html>
